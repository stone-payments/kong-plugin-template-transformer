name: "Test"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }} ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  test:
    runs-on: medium-runner

    strategy:
      fail-fast: false
      matrix:
        kongVersion:
          - "3.7.1.2"

    steps:
      - uses: stone-payments/approved-actions/actions/checkout/v4@stable

      - uses: stone-payments/approved-actions/Kong/kong-pongo-action/v1@stable
        with:
          pongo_version: 2.18.0
          kong_version: ${{ matrix.kongVersion }}

      - run: pongo run -- --Xoutput "--color" --coverage
